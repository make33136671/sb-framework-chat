image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

stages:
  - validate
  - build
  - test
  - package
  - publish

lint:naming:
  stage: validate
  script:
    - echo "=== 检查派生业务关键字 ==="
    - |
      FORBIDDEN="ChatRequirement|ChatBatch|ChatAnalysisBatch|ProjectMilestone|RequirementComment"
      if grep -rE "class\s+($FORBIDDEN)" SB.Chat* --include="*.cs" 2>/dev/null; then
        echo "❌ Chat 抽象层不允许派生业务类型"
        exit 1
      fi
    - echo "✓ 命名规范检查通过"

build:
  stage: build
  script:
    - dotnet restore sb-framework-chat.sln
    - dotnet build sb-framework-chat.sln -c Release --no-restore
  artifacts:
    paths:
      - "**/bin/Release/"
    expire_in: 1 hour

test:
  stage: test
  script:
    - if [ -d SB.Chat.Tests ]; then dotnet test sb-framework-chat.sln -c Release --no-build; else echo "(无测试工程)"; fi
  allow_failure: true

package:
  stage: package
  script:
    - dotnet pack sb-framework-chat.sln -c Release -o ./nupkgs
    - ls -lh ./nupkgs/
  artifacts:
    paths:
      - "nupkgs/"
    expire_in: 1 week

publish:nuget:
  stage: publish
  dependencies:
    - package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - dotnet nuget add source "$CI_API_V4_URL/groups/$SAIBO_FRAMEWORK_GROUP_ID/-/packages/nuget/index.json"
        --name gitlab
        --username gitlab-ci-token
        --password "$CI_JOB_TOKEN"
        --store-password-in-clear-text
    - for pkg in ./nupkgs/SB.Chat*.nupkg; do
        dotnet nuget push "$pkg" --source gitlab --skip-duplicate;
      done
